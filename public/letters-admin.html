<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The gratitude sheet</title>
<style>
  :root { color-scheme: light; --ink: #1c140e; --paper: #f4f0e6; --red: #d51e22; }
  body { margin: 0; padding: 2rem 16px; font: 16px/1.5 ui-monospace, Menlo, monospace; color: var(--ink); background: var(--paper); }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.1rem; letter-spacing: .15em; text-transform: uppercase; border-bottom: 3px double var(--ink); padding-bottom: .4rem; }
  input, button { font: inherit; padding: .45rem .7rem; border: 1.5px solid var(--ink); border-radius: 3px; background: #fff; }
  button { cursor: pointer; }
  .ok { background: var(--ink); color: var(--paper); }
  .no { color: var(--red); border-color: var(--red); }
  li { display: flex; align-items: center; gap: .6rem; padding: .5rem 0; border-bottom: 1px solid #0002; }
  li span { flex: 1; font-size: 1.1rem; }
  ul { list-style: none; padding: 0; }
  #msg { color: #555; }
  h2 { font-size: .9rem; letter-spacing: .15em; text-transform: uppercase; margin-top: 2.5rem; }
</style>
</head>
<body>
<main>
  <h1>The gratitude sheet</h1>
  <form id="auth"><input id="key" type="password" placeholder="admin secret" autocomplete="current-password"> <button>Open</button></form>
  <p id="msg"></p>
  <p><button id="binall" class="no" hidden>Bin everything waiting</button></p>
  <ul id="list"></ul>
  <h2>On the sheet</h2>
  <ul id="printed"></ul>
</main>
<script src="/letters-admin.js"></script>
</body>
</html>
