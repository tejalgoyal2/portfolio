<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Letters waiting</title>
<style>
  :root { color-scheme: light; --ink: #1c140e; --paper: #f4f0e6; --red: #d51e22; }
  body { margin: 0; padding: 2rem 16px; font: 16px/1.5 ui-monospace, Menlo, monospace; color: var(--ink); background: var(--paper); }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.1rem; letter-spacing: .15em; text-transform: uppercase; border-bottom: 3px double var(--ink); padding-bottom: .4rem; }
  input, button { font: inherit; padding: .45rem .7rem; border: 1.5px solid var(--ink); border-radius: 3px; background: #fff; }
  button { cursor: pointer; }
  .ok { background: var(--ink); color: var(--paper); }
  .no { color: var(--red); border-color: var(--red); }
  li { display: flex; align-items: center; gap: .6rem; padding: .5rem 0; border-bottom: 1px solid #0002; }
  li span { flex: 1; font-size: 1.1rem; }
  ul { list-style: none; padding: 0; }
  #msg { color: #555; }
</style>
</head>
<body>
<main>
  <h1>Letters waiting for a look</h1>
  <form id="auth"><input id="key" type="password" placeholder="admin secret" autocomplete="current-password"> <button>Open</button></form>
  <p id="msg"></p>
  <ul id="list"></ul>
</main>
<script>
  // Words flagged by the check wait here. The secret stays in this tab only.
  const key = () => sessionStorage.getItem('letters-key') || '';
  const api = (opts = {}) => fetch('/api/gratitude/admin', { ...opts, headers: { authorization: 'Bearer ' + key(), 'content-type': 'application/json' } });
  const msg = (t) => (document.getElementById('msg').textContent = t);
  async function load() {
    const r = await api();
    if (!r.ok) return msg(r.status === 401 ? 'Wrong secret.' : 'Not set up yet.');
    const { pending } = await r.json();
    const list = document.getElementById('list');
    list.textContent = '';
    msg(pending.length ? pending.length + ' waiting.' : 'Nothing waiting.');
    for (const p of pending) {
      const li = document.createElement('li');
      const w = document.createElement('span');
      w.textContent = p.word;
      li.append(w);
      for (const [label, action, cls] of [['Print it', 'approve', 'ok'], ['Bin it', 'reject', 'no']]) {
        const b = document.createElement('button');
        b.textContent = label;
        b.className = cls;
        b.onclick = async () => { await api({ method: 'POST', body: JSON.stringify({ id: p.id, action }) }); load(); };
        li.append(b);
      }
      list.append(li);
    }
  }
  document.getElementById('auth').onsubmit = (e) => { e.preventDefault(); sessionStorage.setItem('letters-key', document.getElementById('key').value); load(); };
  if (key()) load();
</script>
</body>
</html>
