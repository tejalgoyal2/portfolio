name: Sync blog posts

# Fetch the Jekyll Atom feed and regenerate src/data/blog.js.
# If anything changed, commit as Tejal and push → triggers auto-deploy.

on:
  schedule:
    # Once daily at 08:00 UTC
    - cron: '0 8 * * *'

  # Manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # actions pinned to a commit, not a tag that could be moved; the push token
      # isn't left in .git/config for every later step to find
      - name: Checkout portfolio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      # no install scripts: the feed parser needs none
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync blog posts from feed
        run: node scripts/sync-blog.mjs

      # the token is handed to this one step, only for the push
      - name: Commit updated blog.js if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "Tejal Goyal"
          git config user.email "132282123+tejalgoyal2@users.noreply.github.com"
          git add src/data/blog.js
          if git diff --cached --quiet; then
            echo "No blog changes — skipping commit."
          else
            git commit -m "Update blog posts"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
          fi
