<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Tejal Goyal | Software Engineer</title>
    <meta name="description" content="Building software that feels obvious. I'm Tejal, a software engineer who turns new ideas into products: AI agents, data pipelines, and things that are fun to use." />
    <meta name="keywords" content="software engineer, AI agents, MCP, data engineering, product engineering, React, portfolio, Tejal Goyal" />
    <meta name="author" content="Tejal Goyal" />

    <!-- Open Graph -->
    <meta property="og:title" content="Tejal Goyal | Software Engineer" />
    <meta property="og:description" content="Building software that feels obvious. I'm Tejal, a software engineer who turns new ideas into products: AI agents, data pipelines, and things that are fun to use." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tgoyal.me" />
    <meta property="og:image" content="https://tgoyal.me/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tejal Goyal | Software Engineer" />
    <meta name="twitter:description" content="Building software that feels obvious. I'm Tejal, a software engineer who turns new ideas into products: AI agents, data pipelines, and things that are fun to use." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts — Fraunces (nameplate/heads), Newsreader (body), Anton (impact), JetBrains Mono (data), Caveat (pen):
         our own subsets, and deliberately not preloaded. The first frame is set in system fonts sized to stand
         in for them, and the faces are only asked for once it has painted (src/life/fonts.js), so they never
         take bandwidth from the script that draws it -->

    <!-- Theme color — newsprint cream -->
    <meta name="theme-color" content="#f4efe6" />

    <!-- the pen is the cursor from the very first paint (src/press/PressCursor.jsx takes over), so the OS one never flashes -->
    <script>try{if(matchMedia('(pointer: fine)').matches&&localStorage.getItem('press-nib')!=='system')document.documentElement.classList.add('cursor-hidden')}catch(e){}</script>

    <!-- security headers are real HTTP headers, in public/_headers -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
